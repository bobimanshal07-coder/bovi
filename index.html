<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Birthday Surprise for Riya 🎉</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    * {
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      -khtml-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      box-sizing: border-box;
    }

    input, textarea {
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #2e1065 0%, #1e1b4b 50%, #0f0728 100%);
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      touch-action: manipulation;
    }

    .ambient-glow {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(244, 114, 182, 0.12), transparent 70%),
                  radial-gradient(circle at 20% 80%, rgba(251, 146, 60, 0.08), transparent 50%);
      pointer-events: none;
      z-index: 1;
    }

    #bgCanvas {
      position: fixed;
      inset: 0;
      pointer-events: auto;
      z-index: 2;
      overflow: hidden;
    }

    .balloon {
      position: absolute;
      bottom: -100px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      opacity: 0.75;
      cursor: pointer;
      animation: floatUp linear infinite;
      transition: transform 0.2s ease, opacity 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .balloon::after {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 50%;
      width: 2px;
      height: 14px;
      background: rgba(255, 255, 255, 0.3);
      transform: translateX(-50%);
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-60vh) rotate(6deg); }
      100% { transform: translateY(-120vh) rotate(-6deg); }
    }

    .sparkle {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.6;
      animation: pulseSparkle 3s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes pulseSparkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 0.9; transform: scale(1.4); }
    }

    #app-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
      position: relative;
      z-index: 10;
    }

    .card-box {
      width: 100%;
      max-width: 420px;
      max-height: 92vh;
      overflow-y: auto;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
      border-radius: 1.5rem;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      padding: 1.25rem;
      position: relative;
      transition: backdrop-filter 0.3s ease;
    }

    @keyframes scan {
      0% { top: 0%; }
      50% { top: 100%; }
      100% { top: 0%; }
    }

    @keyframes fall {
      0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    @keyframes swing {
      0% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
      100% { transform: rotate(-3deg); }
    }

    .scan-line {
      position: absolute;
      width: 100%;
      height: 4px;
      background: #00f3ff;
      box-shadow: 0 0 12px #00f3ff, 0 0 25px #00f3ff;
      animation: scan 2s infinite ease-in-out;
      pointer-events: none;
    }

    .falling-msg {
      position: fixed;
      top: -50px;
      z-index: 60;
      pointer-events: none;
      animation: fall 3.5s linear forwards;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #ff758c;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: #e11d48;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .garland-photo {
      animation: swing 4s ease-in-out infinite;
      transform-origin: top center;
    }

    .tilt-card {
      transition: transform 0.15s ease-out;
      will-change: transform;
    }

    .text-glow {
      text-shadow: 0 0 8px rgba(244, 114, 182, 0.6);
    }

    .reveal-line {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.8s forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="ambient-glow"></div>
  <div id="bgCanvas"></div>

  <div id="app-container">
    <div id="card" class="card-box text-center border border-pink-200/50"></div>
  </div>

  <script>
    (function(){
      // Initializing EmailJS with Public Key
      emailjs.init("1_17ZiSFEhTpwcA4M");
    })();

    const bgCanvas = document.getElementById('bgCanvas');
    const hiddenMessages = ["Cute Lagdi Ho! ❤️", "Always Smile 😊", "Special Day ✨", "Stay Blessed 💗", "Paglu 🐒"];
    
    function initBackground() {
      for (let i = 0; i < 25; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        const size = Math.random() * 3 + 1;
        sparkle.style.width = size + 'px';
        sparkle.style.height = size + 'px';
        sparkle.style.left = Math.random() * 100 + 'vw';
        sparkle.style.top = Math.random() * 100 + 'vh';
        sparkle.style.animationDelay = Math.random() * 3 + 's';
        bgCanvas.appendChild(sparkle);
      }

      const colors = [
        'rgba(190, 18, 60, 0.65)',
        'rgba(225, 29, 72, 0.55)',
        'rgba(159, 18, 57, 0.7)',
        'rgba(217, 119, 6, 0.45)',
        'rgba(136, 19, 55, 0.6)'
      ];

      for (let i = 0; i < 12; i++) {
        createBalloon(colors);
      }
    }

    function createBalloon(colors) {
      const b = document.createElement('div');
      b.className = 'balloon';
      const size = Math.random() * 25 + 35;
      b.style.width = size + 'px';
      b.style.height = (size * 1.25) + 'px';
      b.style.left = Math.random() * 92 + 'vw';
      b.style.background = colors[Math.floor(Math.random() * colors.length)];
      
      const blur = Math.random() > 0.5 ? (Math.random() * 2 + 1) : 0;
      b.style.filter = `blur(${blur}px)`;
      
      b.style.animationDuration = (Math.random() * 8 + 10) + 's';
      b.style.animationDelay = Math.random() * 5 + 's';

      b.onclick = (e) => {
        e.stopPropagation();
        popBalloon(b, e.clientX, e.clientY);
      };

      bgCanvas.appendChild(b);
    }

    function popBalloon(balloon, x, y) {
      confetti({
        particleCount: 15,
        spread: 40,
        origin: { x: x / window.innerWidth, y: y / window.innerHeight },
        colors: ['#f472b6', '#fb7185', '#ffd700']
      });

      if (Math.random() > 0.4) {
        const msg = document.createElement('div');
        msg.className = 'falling-msg';
        msg.style.left = Math.min(Math.max(x - 40, 10), window.innerWidth - 120) + 'px';
        msg.style.top = y + 'px';
        msg.innerText = hiddenMessages[Math.floor(Math.random() * hiddenMessages.length)];
        msg.style.animationDuration = '2s';
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 2000);
      }

      balloon.remove();
      setTimeout(() => createBalloon(['rgba(190, 18, 60, 0.65)', 'rgba(225, 29, 72, 0.55)', 'rgba(217, 119, 6, 0.45)']), 3000);
    }

    initBackground();

    let step = 1;
    let holdProgress = 0;
    let holdInterval = null;

    let photos = [
      { src: 'photo1.jpg', caption: 'Your cute smile ❤️' },
      { src: 'photo2.jpg', caption: 'Sweet memory ✨' },
      { src: 'photo3.jpg', caption: 'Traditional vibe 🌸' },
      { src: 'photo4.jpg', caption: 'Gorgeous look 💗' },
      { src: 'photo5.jpg', caption: 'Priceless moment 😌' },
      { src: 'photo6.jpg', caption: 'My favourite 🐒❤️' }
    ];
    let activePhotoIdx = 0;

    const relQuestions = [
      {
        q: '😌 Main jiddan da haan, tenu oh genuine lagda ya thoda zyada hi pagal?',
        options: [
          { text: 'Genuine ❤️', react: 'Aww! Tusi vi bhot pyare ho! 🥺❤️' },
          { text: 'Cute pagal 😂', react: 'Haha! Pagal taan haan par sirf tere layi! 🤪' },
          { text: 'Dono da mixture 😌', react: 'Best combination lagda fer taan! ✨' }
        ]
      },
      {
        q: '🫢 Meri kehdi gall ya aadat tenu kade-kade awkward ya annoying lagdi aa?',
        options: [
          { text: 'Baar-baar puchhna "ki hoya?" 😭', react: 'Care karda haan islayi puchhda haan! 🥺' },
          { text: 'Thodi zyada care karna 😂', react: 'Care thodi zyada hi honi chahidi aa! 🥰' },
          { text: 'Meri overthinking 😌', react: 'Aage ton ghata devanga overthinking! 🧠' },
          { text: 'Kujh hor… 👀', react: 'Mainu dssna zaroor fer baad vich! 😂' }
        ]
      },
      {
        q: '🥹 Je by chance main tere naal gall karni band kar dawaan... tu aap mere naal gall karan di try karegi?',
        options: [
          { text: 'Haan ji, zaroor ❤️', react: 'Eh sun ke dil nu sukoon mileya! ❤️' },
          { text: 'Pehla gussa karungi, fer aap gall karangi 😂', react: 'Thoda gussa vi zaroori aa! 😜' },
          { text: 'Situation te depend karega 😌', react: 'Fair enough! Par gall kar leya karo! 🥹' }
        ]
      },
      {

          { text: 'Tere chhote-chhote details yaad rakhna 🥹', react: 'Har choti gall yaad rehndi aa mainu! ✨' },
          { text: 'Tere dreams nu seriously lena 💗', react: 'Tuhade supne mere supne han! 🌈' }

        options: [

        ]
      }
    ];

    let relIndex = 0;
    let relAnswers = [];
    let relReaction = '';

    const comQuestions = [
      { q: '😊 Apni sohni smile hamesha maintain rakhegi?', options: ['Haan ji, hamesha ❤️', 'Koshish poori rahugi 🥰', 'Reason tusi dinde rehna 😌'] },
      { q: '🫶 Apni health da changi tarah dhyaan rakhegi?', options: ['Haan ji 💗', 'Hun ton pakka 😌', 'Tusi reminder dinde rehna 😂'] },
      { q: '💗 Tu kade vi apne aap nu kise ton ghatt nahi samjhegi?', options: ['Haan ji, kade vi nahi ❤️', 'Mainu pata aa meri value 😌', 'Tusi yaad karwa dinde rehna 😂'] },
      { q: '😂 Birthday party kadon deni aa?', options: ['Jaldi hi 🎂❤️', 'Milange odo party pakki 😌', 'Tusi aayo, fer party dungi 😌❤️'] },
      { q: '🌱 Apne future layi mehnat karna kabhi give up nahi karegi?', options: ['Never ❤️', 'Thak sakdi aa, rukangi nahi 💪', 'Tusi motivation dinde rehna 😭😂'] }
    ];

    let comAnswers = {};
    let isDrawing = false;
    let hasSigned = false;
    let userSignatureData = null;

    function render() {
      const card = document.getElementById('card');

      if (step === 1) {
        card.innerHTML = `
          <div class="text-5xl mb-2">⏳✨</div>
          <h2 class="text-xl font-bold text-pink-600 mb-4">Riya's Birthday Countdown 🎂❤️</h2>
          <div id="timerDisplay" class="grid grid-cols-4 gap-2 text-center font-bold text-gray-700 mb-6"></div>
          <button onclick="setStep(2)" class="bg-gradient-to-r from-pink-500 to-rose-500 text-white px-6 py-3 rounded-full font-semibold shadow-lg active:scale-95 transition w-full">Start Surprise 🎁✨</button>
        `;
        updateTimer();
      } 
      else if (step === 2) {
        card.innerHTML = `
          <div id="monkeyContainer" class="text-6xl mb-3 cursor-pointer transition-transform duration-200">🐒✉️</div>
          <h2 class="text-2xl font-bold text-pink-600 mb-2">A Special Wish For Riya ✨</h2>
          <p class="text-gray-600 text-sm mb-6">Tuhade layi ek chhota jeha pyara surprise!</p>
          <button onclick="setStep(3)" class="bg-gradient-to-r from-pink-500 to-rose-500 text-white px-6 py-3 rounded-full font-semibold shadow-lg active:scale-95 transition">Chal, surprise start kariye → 💌</button>
        `;

        setTimeout(() => {
          const monkey = document.getElementById('monkeyContainer');
          if (monkey) {
            window.onmousemove = (e) => {
              const x = (e.clientX / window.innerWidth - 0.5) * 20;

              monkey.style.transform = `translate(${x}px, ${y}px) scale(1.1)`;
            };
          }
        }, 50);
      } 
      else if (step === 3) {
        card.innerHTML = `
          <h2 class="text-xl font-bold text-gray-800 mb-1">🔐 Biometric Verification</h2>
          <p class="text-xs text-gray-500 mb-4">Press and HOLD finger for 4 seconds!</p>
          
          <div id="fpBox" class="relative w-32 h-36 mx-auto mb-4 bg-slate-900 rounded-2xl border-2 border-cyan-400 flex items-center justify-center overflow-hidden cursor-pointer shadow-lg"
               oncontextmenu="return false;"
               onmousedown="startHold(event)" onmouseup="endHold(event)"
               ontouchstart="startHold(event)" ontouchend="endHold(event)">
            <div id="scanLine" class="scan-line hidden"></div>
            <img src="52318.jpg" alt="Fingerprint" class="w-24 h-28 object-contain pointer-events-none opacity-90" onerror="this.src='https://static.thenounproject.com/png/3474320-200.png'"/>
          </div>

          <div class="w-full bg-gray-200 h-3 rounded-full overflow-hidden mb-2">
            <div id="fpBar" class="bg-cyan-500 h-full transition-all duration-150" style="width: ${holdProgress}%"></div>
          </div>
          <p id="fpText" class="text-xs font-bold text-cyan-600">${holdProgress}%</p>
        `;
      } 
      else if (step === 4) {
        card.innerHTML = `
          <h2 class="text-2xl font-bold text-pink-600 mb-6">Are You Ready For The Surprise? 💗</h2>
          <button onclick="setStep(5)" class="bg-gradient-to-r from-pink-500 to-rose-500 text-white px-6 py-3 rounded-full font-semibold shadow-lg active:scale-95 transition">Yes, I am Ready! ✨</button>
        `;
      }
      else if (step === 5) {
        card.innerHTML = `
          <h1 class="text-3xl font-extrabold text-pink-600 mb-6 animate-pulse">🎉 Happy Birthday Riya ❤️ 🎂</h1>
          <button onclick="setStep(6)" class="bg-gradient-to-r from-pink-500 to-rose-500 text-white px-6 py-3 rounded-full font-semibold shadow-lg active:scale-95 transition">Next ✨</button>
        `;
      } 
      else if (step === 6) {
        card.innerHTML = `
          <div class="text-5xl mb-4">💌</div>
          <p class="text-gray-700 leading-relaxed text-sm mb-6 font-medium">
            "Rabb kare tuhada eh saal khushiyan, achhi health te kamyabi naal bharya rahe. Hamesha eda hi smile karde raho! ✨❤️"
          </p>
          <button onclick="setStep(7)" class="bg-gradient-to-r from-pink-500 to-rose-500 text-white px-6 py-3 rounded-full font-semibold shadow-lg active:scale-95 transition">Chalo agge →</button>
        `;
      } 
      else if (step === 7) {
        card.innerHTML = `
          <h2 class="text-xl font-bold text-pink-600">Some Sweet Moments 💗</h2>
          <p class="text-xs text-gray-400 mb-3">Swipe or tap arrows</p>
          <div id="tiltCardBox" class="tilt-card bg-pink-50 p-3 rounded-2xl shadow-inner border border-pink-100 cursor-pointer">
            <img src="${photos[activePhotoIdx].src}" alt="Memory" class="w-full h-52 object-cover rounded-xl mb-2 shadow-md"/>
            <p class="text-xs font-semibold text-pink-600">${photos[activePhotoIdx].caption}</p>
          </div>
          <div class="flex items-center justify-center gap-4 my-3">
            <button ${activePhotoIdx === 0 ? 'disabled' : ''} onclick="prevPhoto()" class="bg-pink-500 text-white px-3 py-1 rounded-lg text-sm disabled:opacity-30">◀</button>
            <span class="text-xs font-semibold text-gray-500">${activePhotoIdx + 1} / ${photos.length}</span>

          <button onclick="setStep(8)" class="bg-gradient-to-r from-pink-500 to-rose-500 text-white px-6 py-3 rounded-full font-semibold shadow-lg active:scale-95 transition w-full">Agge Chalo →</button>

        setTimeout(() => {
          const tCard = document.getElementById('tiltCardBox');
          if (tCard) {
            tCard.onmousemove = (e) => {
              const rect = tCard.getBoundingClientRect();
              const x = e.clientX - rect.left - rect.width / 2;
              const y = e.clientY - rect.top - rect.height / 2;
              tCard.style.transform = `perspective(1000px) rotateX(${-y / 10}deg) rotateY(${x / 10}deg) scale(1.02)`;

        let q = relQuestions[relIndex];

        card.innerHTML = `

      } 
      else if (step === 9) {
        let completedCount = Object.keys(comAnswers).length;

        let questionsHtml = comQuestions.map((cq, idx) => {
          let isSelected = comAnswers[idx] !== undefined;
          let opts = cq.options.map(opt => `
            <option value="${opt}" ${comAnswers[idx] === opt ? 'selected' : ''}>${opt}</option>

          return `
            <div class="bg-pink-50 p-3 rounded-xl border border-pink-200 text-left mb-3 relative overflow-hidden transition-all">
              <p class="text-xs font-bold text-gray-800 mb-2 flex items-center justify-between">
                <span>Commitment ${idx+1}: ${cq.q}</span>
                ${isSelected ? '<span class="text-green-500 font-extrabold text-sm animate-bounce">✓</span>' : ''}

                ${opts}
              </select>
            </div
